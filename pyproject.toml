[project]
name = "xai-disagreement-auditor"
version = "1.0.0"
description = "Measure how much explanation methods agree, score trust per prediction, and verify against ground truth."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "pandas>=2.0",
  "scipy>=1.10",
  "scikit-learn>=1.3",
  "streamlit>=1.40",
  "plotly>=5.20",
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "pydantic>=2.5",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27", "shap>=0.44"]

[project.scripts]
xaudit = "xaudit.cli:main"

[tool.setuptools]
packages = ["xaudit"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning", "ignore::FutureWarning", "ignore::UserWarning"]

[tool.ruff]
line-length = 120
