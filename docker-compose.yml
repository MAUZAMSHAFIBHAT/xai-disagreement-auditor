services:
  dashboard:
    build: .
    ports: ["8501:8501"]
    restart: unless-stopped
  api:
    build: .
    command: ["python", "-m", "uvicorn", "api.main:app", "--host", "0.0.0.0", "--port", "8000"]
    ports: ["8000:8000"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
    restart: unless-stopped
